<style>
/* loading screen: inline so it is ready before anything else. It stays invisible unless loading is still going on after 0.5 s (see the script below). */
html.boot-shown,html.boot-shown body{overflow:hidden}
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#030705;color:#fff;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility .3s}
#boot.show{opacity:1;visibility:visible;pointer-events:auto}
html.boot-now #boot:not(.out){transition:none}
#boot.out{opacity:0;visibility:hidden;pointer-events:none;transition-duration:.45s}
.boot-in{display:grid;justify-items:center;gap:1.1rem}
.boot-in img{width:58px;height:auto;display:block;animation:bootp 1.6s ease-in-out infinite}
.boot-w{font:500 .8rem/1 "DM Mono",ui-monospace,Menlo,monospace;letter-spacing:.32em;text-transform:uppercase;opacity:.9;padding-left:.32em}
.boot-bar{width:min(180px,52vw);height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.boot-bar i{display:block;height:100%;background:#34D186;transform-origin:left;transform:scaleX(var(--p,.06));transition:transform .4s ease}
html.bk #boot{background:#0B0B0D}html.bk .boot-bar i{background:#FF2B2B}
@keyframes bootp{50%{transform:scale(1.08);opacity:.78}}
@media (prefers-reduced-motion:reduce){.boot-in img{animation:none}#boot{transition:none}}
</style>
<noscript><style>#boot{display:none}</style></noscript>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="boot" role="status" aria-label="Loading Everroam"><div class="boot-in"><img src="media/emblem-white.png" alt=""><span class="boot-w">Everroam</span><div class="boot-bar"><i></i></div></div></div>
<script>
/* Loading screen, for anyone whose first load is slow. It stays invisible unless things are still loading after 0.5 s, so fast connections never see it.
   It shows at once where a slow first load is likely: Instagram's in-app browser, or a 2g/3g connection. Data Saver on: no loading screen.
   Test it anywhere with ?boot=1 (e.g. everroam.in/?boot=1). Switch it off with ?boot=0. */
(function(){var d=document.documentElement,b=document.getElementById("boot"),q=location.search,c=navigator.connection||{},
off=/[?&]boot=0/.test(q)||c.saveData===true,
eager=/[?&]boot=1/.test(q)||/Instagram/i.test(navigator.userAgent)||/(^|-)[23]g$/.test(c.effectiveType||"");
if(off){if(b)b.remove();return}
if(location.hash.indexOf("#/bike")===0)d.classList.add("bk");
function show(){var e=document.getElementById("boot");if(!e)return;window.__bootShown=performance.now();d.classList.add("boot-shown");e.classList.add("show")}
if(eager){d.classList.add("boot-now");show()}else setTimeout(show,Math.max(0,500-performance.now()));
setTimeout(function(){var e=document.getElementById("boot");if(e){e.classList.add("out");d.classList.remove("boot-shown")}},8000)})();
</script>
